openapi: 3.0.3
info:
  title: Ozzu MVP API
  version: 1.0.0
  description: >
    Ozzu MVP OpenAPI 3.0 spec including MVP flows (Registration/Login/Spotlight/Event Page),
    LCM endpoints (Domain/Event/Series/Teams/Players/Wager Cards), Wager creation,
    Scoped Referents, Lounges + Event Lounges + Lounge Entries + Lounge Membership moderation,
    and flexible internalProperties on all domain objects.

servers:
  - url: http://localhost:8080
    description: Local
  - url: https://api.ozzu.ai
    description: Production

tags:
  - name: Users
  - name: Sessions
  - name: Spotlight
  - name: Domains
  - name: Events
  - name: Series
  - name: Teams
  - name: Players
  - name: Concepts
  - name: ScopedReferents
  - name: Wagers
  - name: WagerCardsLCM
  - name: Lounges
  - name: EventLounges
  - name: LoungeEntries
  - name: LoungeMemberships
  - name: Notifications
  - name: Artifacts
  - name: Tokens
  - name: TeamMembers

security:
  - BearerAuth: []

paths:
  /ozzu/users/actions/googleLogin:
    post:
      tags: [ Users, Sessions ]
      summary: Google login (register-if-needed) -> returns Ozzu JWT
      security: [ ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/GoogleLoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /ozzu/users:
    post:
      tags: [Users]
      summary: Registration (supports social logins + referral)
      description: >
        Creates a user. Server credits initial airdrop (500 tokens) and
        referral bonus to referrer (200 tokens) if referralCode is provided.
        Server may auto-join default lounges (Ozzu Lounge).
      security: []  # registration is public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegistrationRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /ozzu/users/{userId}/actions/login:
    post:
      tags: [Sessions]
      summary: Login (creates/refreshes sessionId)
      description: >
        Returns a sessionId. Session expires after X hours unless keepLoggedIn extends it.
      security: []  # login is public
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"

  /ozzu/domains/{domainId}/actions/getSpotlight:
    get:
      tags: [ Spotlight ]
      summary: Spotlight events feed
      description: |
        Returns spotlight events for a domain.

        Includes:
        - Logged-in user's token balance
        - Spotlight events first
        - Non-spotlight events after spotlight events
        - Teams participating in each event
        - Score summary
        - Total users participated
        - Total pot amount
        - Logged-in user's wager, if exists

        Ordering:
        1. Spotlight events first
        2. Then non-spotlight events sorted by time_event_start DESC

      parameters:
        - $ref: "#/components/parameters/DomainId"

        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 5

        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0

        - name: includeNonSpotlight
          in: query
          required: false
          schema:
            type: boolean
            default: true

      responses:
        "200":
          description: Spotlight response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotlightResponse"

  /ozzu/domains:
    post:
      tags: [Domains]
      summary: Create domain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DomainCreateRequest"
      responses:
        "201":
          description: Domain created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
    get:
      tags: [ Domains ]
      summary: List domains
      x-mvp: true
      responses:
        "200":
          description: Domain list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Domain"

  /ozzu/domains/{domainId}:
    get:
      tags: [ Domains ]
      summary: Get domain by id
      parameters:
        - $ref: "#/components/parameters/DomainId"
      responses:
        "200":
          description: Domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"

  /ozzu/domains/{domainId}/events:
    post:
      tags: [ Events ]
      summary: Create event/match
      parameters:
        - $ref: "#/components/parameters/DomainId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/EventCreateRequest"
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"

    get:
      tags: [ Events ]
      summary: List events for domain
      description: |
        Returns list of events for a domain.

        Supports filtering by:
        - seriesId
        - teamId
        - fromDate
        - toDate
        - status

        Response uses the same event shape as Spotlight.
      parameters:
        - $ref: "#/components/parameters/DomainId"

        - name: seriesId
          in: query
          required: false
          schema:
            type: string
            format: uuid

        - name: teamId
          in: query
          required: false
          schema:
            type: string
            format: uuid

        - name: fromDate
          in: query
          required: false
          schema:
            type: string
            format: date

        - name: toDate
          in: query
          required: false
          schema:
            type: string
            format: date

        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ SCHEDULED, LIVE, COMPLETED, CANCELED ]

        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"

      responses:
        "200":
          description: Events list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListResponse"


  /ozzu/domains/{domainId}/events/{eventId}:
    get:
      tags: [ Events ]
      summary: Event page
      description: |
        Returns a single event.

        The response uses the same event object returned in the events list.

        If the event is completed and a detailed score sheet is available,
        eventScores is returned in addition to scoreSummary.
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Event page response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPageResponse"

  /ozzu/domains/{domainId}/events/{eventId}/status:
    patch:
      tags: [ Events ]
      summary: Change event status
      description: |
        Changes event status.

        Allowed transitions:
        - SCHEDULED -> LIVE
        - SCHEDULED -> CANCELED
        - LIVE -> COMPLETED
        - LIVE -> CANCELED

        Side effects:
        - When status becomes LIVE, all PLACED wagers for this event become LOCKED.
        - When status becomes COMPLETED, all LOCKED wagers may be settled by the backend.
        - When status becomes CANCELED, open wagers become CANCELED/VOID and stake may be refunded.
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventStatusUpdateRequest"
      responses:
        "200":
          description: Event status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventStatusUpdateResponse"
        "400":
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /ozzu/domains/{domainId}/players:
    post:
      tags: [ Players ]
      summary: Create player (admin/backoffice)
      parameters:
        - $ref: "#/components/parameters/DomainId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerCreateRequest"
      responses:
        "201":
          description: Player created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
    get:
      tags: [Players]
      summary: List players for a domain
      parameters:
        - $ref: "#/components/parameters/DomainId"
      responses:
        "200":
          description: Player list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"

  /ozzu/domains/{domainId}/players/{playerId}:
    get:
      tags: [ Players ]
      summary: Get player by id
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - $ref: "#/components/parameters/PlayerId"
      responses:
        "200":
          description: Player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "404":
          description: Player not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /ozzu/domains/{domainId}/series:
    post:
      tags: [Series]
      summary: Create series (league/tournament)
      parameters:
        - $ref: "#/components/parameters/DomainId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeriesCreateRequest"
      responses:
        "201":
          description: Series created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Series"
    get:
      tags: [ Series ]
      summary: List series for a domain
      parameters:
        - $ref: "#/components/parameters/DomainId"
      responses:
        "200":
          description: Series list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Series"

  /ozzu/domains/{domainId}/series/{seriesId}:
    get:
      tags: [ Series ]
      summary: Get series by id
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - $ref: "#/components/parameters/SeriesId"
      responses:
        "200":
          description: Series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Series"


  /ozzu/domains/{domainId}/series/{seriesId}/teams:
    post:
      tags: [Teams]
      summary: Create team in series
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - $ref: "#/components/parameters/SeriesId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/TeamCreateRequest"
      responses:
        "201":
          description: Team created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
    get:
      tags: [ Teams ]
      summary: List teams in a series
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - $ref: "#/components/parameters/SeriesId"
      responses:
        "200":
          description: Team list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"

  /ozzu/domains/{domainId}/teams:
    get:
      tags: [ Teams ]
      summary: List teams for a domain
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - name: seriesId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Team list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"

  /ozzu/domains/{domainId}/conceptTerms:
    post:
      tags: [Concepts]
      summary: Create concept term (admin/backoffice)
      parameters:
        - $ref: "#/components/parameters/DomainId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConceptTermCreateRequest"
      responses:
        "201":
          description: Concept term created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConceptTerm"

    get:
      tags: [ Concepts ]
      summary: List concept terms for domain
      parameters:
        - $ref: "#/components/parameters/DomainId"
      responses:
        "200":
          description: Concept terms list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConceptTerm"

  /ozzu/domains/{domainId}/conceptTerms/{conceptTermId}:
    get:
      tags: [ Concepts ]
      summary: Get a concept term by id
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - name: conceptTermId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Concept term
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConceptTerm"

  /ozzu/domains/{domainId}/relationships:
    post:
      tags: [Concepts]
      summary: Create relationship between concept terms (admin/backoffice)
      parameters:
        - $ref: "#/components/parameters/DomainId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelationshipCreateRequest"
      responses:
        "201":
          description: Relationship created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relationship"

  /ozzu/domains/{domainId}/events/{eventId}/odds:
    get:
      tags: [ Odds ]
      summary: Quote odds for an event + wager card type
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - $ref: "#/components/parameters/EventId"
        - name: wagerCardTypeId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      responses:
        "200":
          description: Odds quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OddsQuoteResponse"

  /ozzu/domains/{domainId}/events/{eventId}/scopedReferents:
    post:
      tags: [ScopedReferents]
      summary: Create scoped referents (backend only)
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopedReferentCreateRequest"
      responses:
        "201":
          description: Scoped referent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopedReferent"
    get:
      tags: [ScopedReferents]
      summary: Get scoped referents for event
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Scoped referents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScopedReferent"

  /ozzu/domains/{domainId}/events/{eventId}/wagers:
    post:
      tags: [ Wagers ]
      summary: Create wager
      description: |
        Creates a wager for an event.
        Input uses direct wagerCards and bindings.
        Maximum 5 wager cards are allowed per wager.
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WagerCreateRequest"
      responses:
        "201":
          description: Wager created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wager"

  /ozzu/domains/{domainId}/actions/getWagers:
    get:
      tags: [ Wagers ]
      summary: Get wagers for domain
      description: |
        Returns wagers across all events in this domain.

        If userId is passed, returns wagers only for that user.

        Each wager includes wagerCards and their binding picks.
      parameters:
        - $ref: "#/components/parameters/DomainId"

        - name: userId
          in: query
          required: false
          schema:
            type: string
            format: uuid

        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20

        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Wagers response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WagerListResponse"

  /ozzu/domains/{domainId}/wagerCards:
    post:
      tags: [WagerCardsLCM]
      summary: Create wager card type (template)
      parameters:
        - $ref: "#/components/parameters/DomainId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WagerCardTypeCreateRequest"
      responses:
        "201":
          description: Wager card type created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WagerCardType"
    get:
      tags: [ WagerCardsLCM ]
      summary: List wager card types for domain
      description: |
        Returns wager card types for a domain.
        Each wager card type includes its bindings.
      parameters:
        - $ref: "#/components/parameters/DomainId"
      responses:
        "200":
          description: Wager card types response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WagerCardTypeListResponse"

  /ozzu/domains/{domainId}/wagerCards/{wagerCardTypeId}:
    get:
      tags: [ WagerCardsLCM ]
      summary: Get wager card type detail
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - $ref: "#/components/parameters/WagerCardTypeId"
      responses:
        "200":
          description: Wager card type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WagerCardType"

  /ozzu/domains/{domainId}/wagerCards/{wagerCardTypeId}/bindings:
    post:
      tags: [WagerCardsLCM]
      summary: Create wager card type binding (required pick slot)
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - $ref: "#/components/parameters/WagerCardTypeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WagerCardTypeBindingCreateRequest"
      responses:
        "201":
          description: Wager card type binding created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WagerCardTypeBinding"
    get:
      tags: [ WagerCardsLCM ]
      summary: List bindings for a wager card type
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - $ref: "#/components/parameters/WagerCardTypeId"
      responses:
        "200":
          description: Wager card type bindings response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WagerCardTypeBindingListResponse"

  /ozzu/domains/{domainId}/lounges:
    post:
      tags: [Lounges]
      summary: Create lounge (e.g., Nike, Adidas, Ozzu)
      description: >
        Server can credit P2E (e.g., +200 tokens) for creating lounges.
      parameters:
        - $ref: "#/components/parameters/DomainId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoungeCreateRequest"
      responses:
        "201":
          description: Lounge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lounge"

  /ozzu/domains/{domainId}/lounges/{loungeId}:
    get:
      tags: [ Lounges ]
      summary: Get lounge (e.g., Nike, Adidas, Ozzu)
      description: >
        Get an Lounge
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - $ref: "#/components/parameters/LoungeId"
      responses:
        "200":
          description: Lounge Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lounge"

  /ozzu/domains/{domainId}/lounges/actions/getMyLounges:
    get:
      tags: [Lounges]
      summary: List lounges created by current user in domain
      parameters:
        - $ref: "#/components/parameters/DomainId"
      responses:
        "200":
          description: Lounges list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lounge"

  /ozzu/domains/{domainId}/events/{eventId}/eventLounges:
    get:
      tags: [ EventLounges ]
      summary: Get event lounges (lounge hosting an event)
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Event lounges List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventLounge"
    post:
      tags: [EventLounges]
      summary: Create event lounge (lounge hosting an event)
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventLoungeCreateRequest"
      responses:
        "201":
          description: Event lounge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventLounge"

  /ozzu/domains/{domainId}/teams/{teamId}/members:
    post:
      tags: [ TeamMembers, Teams ]
      summary: Add player to team (create team member)
      description: >
        Adds a player to a team roster. Enforces:
        - team.domainId == domainId
        - player.domainId == domainId
        - uniqueness (teamId, playerId)
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberCreateRequest"
      responses:
        "201":
          description: Team member created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "409":
          description: Player already exists in team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Domain/Team/Player not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    get:
      tags: [ TeamMembers, Teams ]
      summary: List team roster (team members)
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Team roster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"

  /ozzu/domains/{domainId}/teams/{teamId}/members/{playerId}:
    delete:
      tags: [ TeamMembers, Teams ]
      summary: Remove player from team (delete team member)
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/PlayerId"
      responses:
        "204":
          description: Removed
        "404":
          description: Membership not found (or domain/team/player not found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /ozzu/domains/{domainId}/events/{eventId}/eventLounges/{eventLoungeId}/loungeEntries:
    get:
      tags: [ LoungeEntries ]
      summary: Get / entries from an event lounge
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/EventLoungeId"
        - $ref: "#/components/parameters/QueryUserId"
      responses:
        "200":
          description: List of Lounge Entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoungeEntry"
    post:
      tags: [LoungeEntries]
      summary: Register / enter an event lounge
      description: >
        Server may debit entry fee (e.g., 100 tokens) depending on event lounge configuration.
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/EventLoungeId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoungeEntryCreateRequest"
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoungeEntry"

  /ozzu/lounges/{loungeId}/members:
    post:
      tags: [LoungeMemberships]
      summary: Invite / admit user to lounge
      parameters:
        - $ref: "#/components/parameters/LoungeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoungeMemberCreateRequest"
      responses:
        "201":
          description: Membership created/updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoungeMembership"
    get:
      tags: [LoungeMemberships]
      summary: List lounge members
      parameters:
        - $ref: "#/components/parameters/LoungeId"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LoungeMemberStatus"
        - name: role
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LoungeMemberRole"
      responses:
        "200":
          description: Members list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoungeMembershipListResponse"

  /ozzu/lounges/{loungeId}/members/{memberUserId}:
    patch:
      tags: [LoungeMemberships]
      summary: Update member (activate/inactivate/remove/ban, role changes)
      parameters:
        - $ref: "#/components/parameters/LoungeId"
        - name: memberUserId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoungeMemberUpdateRequest"
      responses:
        "200":
          description: Updated membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoungeMembership"

  /ozzu/lounges/{loungeId}/actions/notify:
    post:
      tags: [Notifications]
      summary: Notify lounge members
      parameters:
        - $ref: "#/components/parameters/LoungeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoungeNotifyRequest"
      responses:
        "201":
          description: Notification created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoungeNotification"

  /ozzu/domains/{domainId}/artifacts:
    get:
      tags: [Artifacts]
      summary: List artifacts (shorts/content) for domain/event/lounge
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - name: eventId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: loungeId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: eventLoungeId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Artifacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Artifact"

  /ozzu/domains/{domainId}/artifacts/{artifactId}/actions/view:
    post:
      tags: [Artifacts]
      summary: Record artifact view (supports P2E)
      description: >
        Records a view. Server may credit tokens based on active reward campaigns
        (e.g., 25 shorts -> 50 tokens; lounge 5 artifacts -> 50 tokens).
      parameters:
        - $ref: "#/components/parameters/DomainId"
        - $ref: "#/components/parameters/ArtifactId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactViewRequest"
      responses:
        "200":
          description: View recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactViewResponse"
  /ozzu/users/{userId}/actions/getNotifications:
    get:
      tags:
        - UserNotifications
      operationId: getNotifications
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      responses:
        "200":
          description: User notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserNotificationsResponse"
  /ozzu/users/{userId}/actions/updateNotifications:
    post:
      tags:
        - UserNotifications
      operationId: updateNotifications
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNotificationsRequest"
      responses:
        "200":
          description: Notifications updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateNotificationsResponse"
  /ozzu/users/{userId}/tokens/balance:
    get:
      tags: [Tokens]
      summary: Get token balance
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenBalanceResponse"

  /ozzu/users/{userId}:
    get:
      tags: [ Users ]
      summary: Update User
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

    put:
      tags: [ Users ]
      summary: Update User
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UserPutRequest"
      responses:
        "200":
          description: Balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Maximum items to return

    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor for pagination

    DomainId:
      name: domainId
      in: path
      required: true
      schema: { type: string, format: uuid }

    ConceptTermId:
      name: conceptTermId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    TeamId:
      name: teamId
      in: path
      required: true
      schema: { type: string, format: uuid }

    PlayerId:
      name: playerId
      in: path
      required: true
      schema: { type: string, format: uuid }

    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }

    SeriesId:
      name: seriesId
      in: path
      required: true
      schema: { type: string, format: uuid }

    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }

    QueryUserId:
      name: userId
      in: query
      required: false
      schema:
        {type: string, format: uuid}

    LoungeId:
      name: loungeId
      in: path
      required: true
      schema: { type: string, format: uuid }

    EventLoungeId:
      name: eventLoungeId
      in: path
      required: true
      schema: { type: string, format: uuid }

    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema: { type: string, format: uuid }

    WagerCardTypeId:
      name: wagerCardTypeId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    UUID:
      type: string
      format: uuid

    Timestamp:
      type: string
      format: date-time

    InternalProperties:
      type: object
      description: Arbitrary JSON properties for forward compatibility.
      additionalProperties: true

    ApiError:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        details:
          $ref: "#/components/schemas/InternalProperties"

    AuthProvider:
      type: string
      enum: [EMAIL, GOOGLE, APPLE, FACEBOOK]

    UserPutRequest:
      type: object
      properties:
        displayName:
          type: string
        profilePhoto:
          type: string
          format: binary
          description: Base64 encoded profile photo

    GoogleLoginRequest:
      type: object
      required: [ idToken ]
      properties:
        idToken:
          type: string
          description: Google ID token (JWT) from Web/Android
        displayName:
          type: string
          description: User Display
        profilePhoto:
          type: string
          format: binary
          description: Base64 encoded profile photo
        referralCode:
          type: string
          description: Optional referral code (applied only on first-time user creation)
        internalProperties:
          $ref: "#/components/schemas/InternalProperties"

    AuthResponse:
      type: object
      required: [ accessToken, tokenType, expiresInSeconds ]
      properties:
        accessToken:
          type: string
          description: Ozzu JWT
        tokenType:
          type: string
          example: Bearer
        expiresInSeconds:
          type: integer
          example: 7200
        userId:
          type: string

    UserRegistrationRequest:
      type: object
      required: [displayName, provider, providerUserId]
      properties:
        displayName: { type: string }
        provider:
          $ref: "#/components/schemas/AuthProvider"
        providerUserId: { type: string }
        referralCode: { type: string }
        internalProperties:
          $ref: "#/components/schemas/InternalProperties"

    User:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        displayName: { type: string }
        provider: { $ref: "#/components/schemas/AuthProvider" }
        providerUserId: { type: string }
        timeCreated: { $ref: "#/components/schemas/Timestamp" }
        timeUpdated: { $ref: "#/components/schemas/Timestamp" }
        imageUrl: {type: string, format: url}
        internalProperties:
          $ref: "#/components/schemas/InternalProperties"

    LoginRequest:
      type: object
      properties:
        keepLoggedIn: { type: boolean, default: false }
        internalProperties:
          $ref: "#/components/schemas/InternalProperties"

    LoginResponse:
      type: object
      properties:
        userId: { $ref: "#/components/schemas/UUID" }
        sessionId: { type: string }
        expiresAt: { $ref: "#/components/schemas/Timestamp" }
        internalProperties:
          $ref: "#/components/schemas/InternalProperties"

    ContextualFacet:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        timeCreated: { $ref: "#/components/schemas/Timestamp" }
        timeBegin: { $ref: "#/components/schemas/Timestamp" }
        timeEnd: { $ref: "#/components/schemas/Timestamp" }
        geoLocation: { type: string }
        searchTerms:
          type: array
          items: { type: string }
        relatedObjects:
          type: array
          items:
            $ref: "#/components/schemas/RelatedObject"
        internalProperties:
          $ref: "#/components/schemas/InternalProperties"

    RelatedObject:
      type: object
      properties:
        objectType: { type: string }
        objectId: { $ref: "#/components/schemas/UUID" }
        objectURI: { type: string }
        name: { type: string }
        description: { type: string }
        timeCreated: { $ref: "#/components/schemas/Timestamp" }
        internalProperties:
          $ref: "#/components/schemas/InternalProperties"

    SpotlightRequest:
      type: object
      properties:
        contextualFacet:
          $ref: "#/components/schemas/ContextualFacet"

    SpotlightResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/SpotlightEvent"
        pagination:
          $ref: "#/components/schemas/Pagination"
        tokens:
          type: integer
          format: int64
          description: Logged-in user's available token balance

    SpotlightEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        domainId:
          type: string
          format: uuid
        seriesId:
          type: string
          format: uuid
        seriesName:
          type: string
        name:
          type: string
        eventImageUrl:
          type: string
        eventLocation:
          type: string
        venue:
          type: string
        description:
          type: string
        timeCreated:
          type: string
          format: date-time
        timeUpdated:
          type: string
          format: date-time
        timeEventStart:
          type: string
          format: date-time
        timeEventEnd:
          type: string
          format: date-time
        isEventCanceled:
          type: boolean
        isEventCompleted:
          type: boolean
        isSpotlight:
          type: boolean
        usersCount:
          type: integer
          format: int64
          description: Number of users who participated/wagered
        potAmount:
          type: integer
          description: Total pot amount for this event
        userWager:
          $ref: "#/components/schemas/SpotlightUserWager"
        internalProperties:
          type: object
          additionalProperties: true
        teams:
          type: array
          items:
            $ref: "#/components/schemas/SpotlightTeam"
        scoreSummary:
          $ref: "#/components/schemas/ScoreSummary"

    SpotlightTeam:
      type: object
      properties:
        id:
          type: string
          format: uuid
        domainId:
          type: string
          format: uuid
        seriesId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        teamImageUrl:
          type: string
        score:
          type: string
          description: Display score for the team, if available

    SpotlightUserWager:
      type: object
      properties:
        amount:
          type: integer
        outcome:
          type: string

    ScoreSummary:
      type: object
      properties:
        innings:
          type: array
          items:
            $ref: "#/components/schemas/InningsScore"

    InningsScore:
      type: object
      properties:
        team:
          type: string
        inningNumber:
          type: integer
        runs:
          type: integer
        wickets:
          type: integer
        overs:
          type: number
          format: double
        runRate:
          type: number
          format: double
        isCompleted:
          type: boolean

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        totalItems:
          type: integer
        nextPage:
          type: integer
        prevPage:
          type: integer
    DomainCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        internalProperties:
          $ref: "#/components/schemas/InternalProperties"
    SpotlightItemType:
      type: string
      enum:
        - SHORTS
        - SPOTLIGHT_GAME
        - CELEBRITY_WAGERS
        - INFO_BLOCK
    Domain:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        description: { type: string }
        timeCreated: { $ref: "#/components/schemas/Timestamp" }
        timeUpdated: { $ref: "#/components/schemas/Timestamp" }
        internalProperties:
          $ref: "#/components/schemas/InternalProperties"

    SeriesCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        internalProperties:
          $ref: "#/components/schemas/InternalProperties"

    Series:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        domainId: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        description: { type: string }
        timeCreated: { $ref: "#/components/schemas/Timestamp" }
        timeUpdated: { $ref: "#/components/schemas/Timestamp" }
        internalProperties:
          $ref: "#/components/schemas/InternalProperties"

    EventCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        seriesId: { $ref: "#/components/schemas/UUID" }
        timeEventStart: { $ref: "#/components/schemas/Timestamp" }
        timeEventEnd: { $ref: "#/components/schemas/Timestamp" }
        image:
          type: string
          format: binary
          description: Base64 encoded profile photo
        internalProperties:
          type: string
          description: JSON Format

    Scorecard:
      type: object
      description: Cricket scorecard schema placeholder (stored as JSON by server).
      additionalProperties: true

    LineupEntry:
      type: object
      properties:
        participantType: { type: string, enum: [PLAYER, TEAM] }
        participantId: { $ref: "#/components/schemas/UUID" }
        role: { type: string }
        internalProperties:
          $ref: "#/components/schemas/InternalProperties"

    Player:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        domainId: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        objectType: { type: string }
        objectProfile: { type: string }
        objectStatus: { type: string }
        description: { type: string }
        timeCreated: { $ref: "#/components/schemas/Timestamp" }
        timeUpdated: { $ref: "#/components/schemas/Timestamp" }
        imageUrl:
          type: string
        videoUrl:
          type: string
        thumbnailUrl:
          type: string
        internalProperties:
          $ref: "#/components/schemas/InternalProperties"

    TeamCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        image:
          type: string
          format: binary
          description: Base64 encoded profile photo
        internalProperties:
          type: string
          description: JSON Format

    Team:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        domainId: { $ref: "#/components/schemas/UUID" }
        seriesId: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        description: { type: string }
        imageUrl: {type: string, format: url}
        videoUrl:
          type: string
        thumbnailUrl:
          type: string
        timeCreated: { $ref: "#/components/schemas/Timestamp" }
        timeUpdated: { $ref: "#/components/schemas/Timestamp" }
        internalProperties:
          $ref: "#/components/schemas/InternalProperties"

    ConceptTermCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        parentConceptTermId: { $ref: "#/components/schemas/UUID" }
        objectType: { type: string }
        objectProfile: { type: string }
        objectStatus: { type: string }
        isInternal: { type: boolean }
        internalProperties:
          $ref: "#/components/schemas/InternalProperties"

    ConceptTerm:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        domainId: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        description: { type: string }
        parentConceptTermId: { $ref: "#/components/schemas/UUID" }
        objectType: { type: string }
        objectProfile: { type: string }
        objectStatus: { type: string }
        isInternal: { type: boolean }
        timeCreated: { $ref: "#/components/schemas/Timestamp" }
        timeUpdated: { $ref: "#/components/schemas/Timestamp" }
        imageUrl:
          type: string
        videoUrl:
          type: string
        thumbnailUrl:
          type: string
        internalProperties:
          $ref: "#/components/schemas/InternalProperties"

    RelationshipType:
      type: string
      enum: [IS_A, PART_OF, RELATED_TO, DEPENDS_ON, CAUSES, CUSTOM]

    RelationshipCreateRequest:
      type: object
      required: [fromConceptTermId, toConceptTermId, relationshipType]
      properties:
        fromConceptTermId: { $ref: "#/components/schemas/UUID" }
        toConceptTermId: { $ref: "#/components/schemas/UUID" }
        relationshipType: { $ref: "#/components/schemas/RelationshipType" }
        strength: { type: number, format: float }
        internalProperties:
          $ref: "#/components/schemas/InternalProperties"

    Relationship:
      type: object
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        domainId: { $ref: "#/components/schemas/UUID" }
        fromConceptTermId: { $ref: "#/components/schemas/UUID" }
        toConceptTermId: { $ref: "#/components/schemas/UUID" }
        relationshipType: { $ref: "#/components/schemas/RelationshipType" }
        strength: { type: number, format: float }
        timeCreated: { $ref: "#/components/schemas/Timestamp" }
        timeUpdated: { $ref: "#/components/schemas/Timestamp" }
        internalProperties:
          $ref: "#/components/schemas/InternalProperties"

    ScopedEntityType:
      type: string
      enum: [PLAYER, TEAM, TEXT]

    WagerCreateRequest:
      type: object
      required:
        - name
        - stakeTokens
        - wagerCards
      properties:
        name:
          type: string
        stakeTokens:
          type: integer
          minimum: 0
          description: Stake amount in Ozzu tokens
        acceptOddsSlippageBps:
          type: integer
          minimum: 0
          maximum: 10000
          default: 50
          description: Allowed slippage in basis points. 50 means 0.50%.
        wagerCards:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: "#/components/schemas/WagerCreateCardRequest"
        internalProperties:
          $ref: "#/components/schemas/InternalProperties"
    EventStatus:
      type: string
      enum: [ SCHEDULED, LIVE, COMPLETED, CANCELED ]

    WagerEnteredEventLounge:
      type: object
      properties:
        eventLoungeId:
          $ref: "#/components/schemas/UUID"
        eventId:
          $ref: "#/components/schemas/UUID"
        wagerId:
          $ref: "#/components/schemas/UUID"
        loungeId:
          $ref: "#/components/schemas/UUID"
        loungeName:
          type: string
        timeCreated:
          $ref: "#/components/schemas/Timestamp"

    EventStatusUpdateRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/EventStatus"
        reason:
          type: string
          description: Optional reason for status change.
          example: Match started
        internalProperties:
          $ref: "#/components/schemas/InternalProperties"

    EventStatusUpdateResponse:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        domainId:
          $ref: "#/components/schemas/UUID"
        status:
          $ref: "#/components/schemas/EventStatus"
        previousStatus:
          $ref: "#/components/schemas/EventStatus"
        lockedWagersCount:
          type: integer
          description: Number of wagers moved from PLACED to LOCKED when event became LIVE.
        settledWagersCount:
          type: integer
          description: Number of wagers settled when event became COMPLETED.
        canceledWagersCount:
          type: integer
          description: Number of wagers canceled when event became CANCELED.
        timeUpdated:
          $ref: "#/components/schemas/Timestamp"
        internalProperties:
          $ref: "#/components/schemas/InternalProperties"

    WagerCreateCardRequest:
      type: object
      required:
        - wagerCardTypeId
      properties:
        wagerCardTypeId:
          $ref: "#/components/schemas/UUID"
        bindings:
          type: array
          items:
            $ref: "#/components/schemas/WagerCreateCardBindingRequest"

    WagerCreateCardBindingRequest:
      type: object
      required:
        - wagerCardTypeBindingId
      properties:
        wagerCardTypeBindingId:
          $ref: "#/components/schemas/UUID"
        conceptId:
          $ref: "#/components/schemas/UUID"
          description: Concept term id. Kept as conceptId in request for frontend simplicity.
        playerId:
          $ref: "#/components/schemas/UUID"
        teamId:
          $ref: "#/components/schemas/UUID"
        scopedReferentId:
          $ref: "#/components/schemas/UUID"
        bindingValueId:
          $ref: "#/components/schemas/UUID"
        value:
          type: string
        pickPayload:
          type: object
          additionalProperties: true

    OddsQuoteResponse:
      type: object
      required: [ domainId, eventId, wagerCardTypeId, bindings ]
      properties:
        domainId: { $ref: "#/components/schemas/UUID" }
        eventId: { $ref: "#/components/schemas/UUID" }
        wagerCardTypeId: { $ref: "#/components/schemas/UUID" }
        locked:
          type: boolean
          description: True when quoting is disabled due to event status
        bindings:
          type: array
          items:
            $ref: "#/components/schemas/OddsBindingQuote"
        internalProperties:
          $ref: "#/components/schemas/InternalProperties"

    OddsBindingQuote:
      type: object
      required: [ wagerCardTypeBindingId, conceptTermId, picks ]
      properties:
